name: "anosppqc"
description: "ANOSPP data aggregation"
keywords:
  - amplicon
tools:
  - "anosppqc":
      description: "ANOSPP data aggregation"
      homepage: "None"
      documentation: "None"
      tool_dev_url: "None"
      doi: ""
      licence: "['MIT']"

input:
  # Only when we have meta
  # - meta:
  #     type: map
  #     description: |
  #       Groovy Map containing sample information
  #       e.g. [ id:'test', single_end:false ]

  - comb_stats:
      type: file
      description: combined stats tsv file produced by anospp-prep
      pattern: "*.tsv"

  - nn_assignment:
      type: file
      description: NN assignment tsv file produced by anospp-nn
      pattern: "*.tsv"

  - vae_assignment:
      type: file
      description: VAE assignment tsv file produced by anospp-vae
      pattern: "*.tsv"

  - plasm_assignment:
      type: file
      description: Plasmodium assignment tsv file produced by anospp-plasm
      pattern: "*.tsv"

output:
  #Only when we have meta
  # - meta:
  #     type: map
  #     description: |
  #       Groovy Map containing sample information
  #       e.g. [ id:'test', single_end:false ]

  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

  - anospp_results:
      type: file
      description: aggregated ANOSPP results for a run
      pattern: "*.tsv"

authors:
  - "@amakunin"
