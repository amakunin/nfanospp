name: "anosppqc"
description: "ANOSPP data QC summary and plots"
keywords:
  - amplicon
tools:
  - "anosppqc":
      description: "ANOSPP data QC summary and plots"
      homepage: "None"
      documentation: "None"
      tool_dev_url: "None"
      doi: ""
      licence: "['MIT']"

input:
  # Only when we have meta
  # - meta:
  #     type: map
  #     description: |
  #       Groovy Map containing sample information
  #       e.g. [ id:'test', single_end:false ]

  - haps:
      type: file
      description: haplotypes tsv file produced by anospp-prep
      pattern: "*.tsv"

  - comb_stats:
      type: file
      description: combined stats tsv file produced by anospp-prep
      pattern: "*.tsv"

output:
  #Only when we have meta
  # - meta:
  #     type: map
  #     description: |
  #       Groovy Map containing sample information
  #       e.g. [ id:'test', single_end:false ]

  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

  - qc_plots:
      type: file
      description: static QC plots
      pattern: "*.png"

authors:
  - "@amakunin"
