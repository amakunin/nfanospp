name: "anosppprep"
description: "ANOSPP data deplexing and prep"
keywords:
  - amplicon
tools:
  - "anosppprep":
      description: "ANOSPP data deplexing and prep"
      homepage: "None"
      documentation: "None"
      tool_dev_url: "None"
      doi: ""
      licence: "['MIT']"

input:
  # Only when we have meta
  # - meta:
  #     type: map
  #     description: |
  #       Groovy Map containing sample information
  #       e.g. [ id:'test', single_end:false ]

  - dada_table:
      type: file
      description: DADA2 output table tsv
      pattern: "*.tsv"

  - adapters_fa:
      type: file
      description: fasta file with adapters used for demultiplexing amplicons
      pattern: "*.{fa,fasta}"

  - manifest:
      type: file
      description: samples manifest
      pattern: "*.{csv,tsv}"

  - dada_stats:
      type: file
      description: DADA2 stats output summary tsv
      pattern: "*.tsv"

  - run_id:
      type: integer
      description: numeric run identifer to be included in plot headers

output:
  #Only when we have meta
  # - meta:
  #     type: map
  #     description: |
  #       Groovy Map containing sample information
  #       e.g. [ id:'test', single_end:false ]

  - versions:
      type: file
      description: file containing software versions
      pattern: "versions.yml"

  - haps:
      type: file
      description: amplicon haplotypes tsv
      pattern: "*.tsv"

  - comb_stats:
      type: file
      description: combined stats tsv file
      pattern: "*.tsv"

authors:
  - "@amakunin"
